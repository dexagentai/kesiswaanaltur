<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Surat Keterangan Pindah</title>
  <script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
    const supabaseUrl = 'https://pgyohppycxecdnfmoqgk.supabase.co'
    const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBneW9ocHB5Y3hlY2RuZm1vcWdrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODExNDM2NDEsImV4cCI6MjA5NjcxOTY0MX0.prvXAPB3ljwwsgaFq0dLng4Ejt2J9ViSX9gk7a38zdY' // anon key kamu
    const supabase = createClient(supabaseUrl, supabaseKey)

    async function loadKelas() {
      const { data, error } = await supabase
        .from('siswa')
        .select('Kelas_jurusan')

      if (error) { console.error(error); return }

      const kelasSet = [...new Set(data.map(s => s.Kelas_jurusan).filter(Boolean))]
      const kelasSelect = document.getElementById('kelas')
      kelasSelect.innerHTML = '<option value="">-- Pilih Kelas --</option>'
      kelasSet.forEach(k => {
        const opt = document.createElement('option')
        opt.value = k
        opt.textContent = k
        kelasSelect.appendChild(opt)
      })
    }

    async function loadSiswa() {
      const kelas = document.getElementById('kelas').value
      const { data, error } = await supabase
        .from('siswa')
        .select('id, Nama')
        .eq('Kelas_jurusan', kelas)

      if (error) { console.error(error); return }

      const siswaSelect = document.getElementById('siswa')
      siswaSelect.innerHTML = '<option value="">-- Pilih Siswa --</option>'
      data.forEach(s => {
        const opt = document.createElement('option')
        opt.value = s.id
        opt.textContent = s.Nama
        siswaSelect.appendChild(opt)
      })
    }

    async function isiData() {
      const id = document.getElementById('siswa').value
      if (!id) return
      const { data, error } = await supabase
        .from('siswa')
        .select('*')
        .eq('id', id)
        .single()

      if (error) { console.error(error); return }
      window.selectedSiswa = data
    }

    window.buatSurat = function() {
      const s = window.selectedSiswa
      if (!s) return alert("Pilih siswa terlebih dahulu.")
      const tanggal = new Date().toLocaleDateString('id-ID')

      const isi = `
        Yang bertanda tangan di bawah ini Kepala SMK Al-Huda Turalak Kabupaten Ciamis<br>
        Dengan ini menerangkan dengan sebenarnya bahwa:<br><br>
        1. Nama : ${s.Nama}<br>
        2. Jenis Kelamin : ${s.JK}<br>
        3. Agama : ${s.Agama}<br>
        4. NISN : ${s.NISN}<br>
        5. Nama Orang Tua : ${s.Ortu}<br><br>
        Adalah benar nama tersebut di atas tercatat sebagai siswa pada:<br>
        1. Nama Sekolah : SMK AL HUDA TURALAK<br>
        2. Nomor Induk Siswa : ${s.NIPD}<br>
        3. Kelas : ${s.Kelas_jurusan}<br><br>
        Berdasarkan permohonan orang tua/wali dan keinginan yang bersangkutan telah mengajukan pindah sekolah dengan alasan permintaan orang tua.<br><br>
        Demikian Surat Keterangan Pindah ini dibuat dengan sebenar-benarnya dan dapat dipergunakan sebagaimana mestinya.
      `
      document.getElementById('isiSurat').innerHTML = isi
      document.getElementById('tanggal').innerText = tanggal
      document.getElementById('preview').style.display = 'block'
    }

    // load kelas saat halaman dibuka
    loadKelas()
  </script>
  <style>
    /* gaya sama seperti sebelumnya */
  </style>
</head>
<body>
  <div class="container">
    <!-- kop surat sama seperti sebelumnya -->

    <h2 class="title">SURAT KETERANGAN PINDAH</h2>
    <p style="text-align:center;">Nomor: <span id="nomor">52/SP/SMK-AH/IX/2026</span></p>

    <div class="form-section">
      <label>Pilih Kelas</label>
      <select id="kelas" onchange="loadSiswa()">
        <option value="">-- Pilih Kelas --</option>
      </select>

      <label>Pilih Siswa</label>
      <select id="siswa" onchange="isiData()">
        <option value="">-- Pilih Siswa --</option>
      </select>

      <button type="button" onclick="buatSurat()">Buat Surat</button>
      <button type="button" onclick="window.print()">Cetak Surat</button>
    </div>

    <div class="preview" id="preview" style="display:none;">
      <p id="isiSurat"></p>
      <br><br>
      <p style="text-align:right;">Ciamis, <span id="tanggal"></span><br>Kepala Sekolah<br><br><br><b>IING APIPUDIN, S.Ag</b></p>
    </div>
  </div>
</body>
</html>
